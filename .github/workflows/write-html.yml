name: Kenny Form Data Forwarder

on:
  repository_dispatch:
    types: [*] # Wakes up when your email program hits Kenny

jobs:
  post-form-data:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Data and POST as Form Fields
        run: |
          # 1. Pull the raw payload text captured by Kenny
          RAW_TEXT=$(echo '${{ toJSON(github.event.client_payload) }}')

          # 2. Fire a standard form post to your News Repo outbound webhook
          curl -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "payload=${RAW_TEXT}" \
            https://api.github.com/repos/kenny0537YAhoo/New/dispatches
