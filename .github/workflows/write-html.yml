name: Kenny Chat Connection Engine

on:
  repository_dispatch:
    types: [*] # Wakes up automatically when the chat link hits Kenny

jobs:
  build-and-trigger:
    runs-on: ubuntu-latest
    steps:
      # 1. Open up Kenny's workspace environment
      - name: Checkout Kenny
        uses: actions/checkout@v4

      # 2. Log directly into the News Repo using your profile's shared authorization token
      - name: Open Connection to News Repo
        uses: actions/checkout@v4
        with:
          repository: 'kenny0537YAhoo/New'
          token: ${{ secrets.GITHUB_TOKEN }}
          path: 'news_repo_folder'

      # 3. Take the chat message and write it straight into the index.html inside the News folder
      - name: Build Chat Webpage File
        run: |
          cat << 'EOF' > news_repo_folder/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>Live Chat Output</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 30px; background: #fdfdfd; text-align: center; }
                  .card { max-width: 600px; margin: 50px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid #eaeaea; }
                  .output { background: #f8f9fa; border-left: 4px solid #0066cc; padding: 20px; text-align: left; white-space: pre-wrap; font-family: monospace; word-break: break-all; }
              </style>
          </head>
          <body>
              <div class="card">
                  <h1>Live Chat Update</h1>
                  <p style="color: #666;">Message processed entirely on autopilot via Kenny:</p>
                  
                  <div class="output">${{ toJSON(github.event.client_payload) }}</div>
                  
                  <div class="footer" style="margin-top:20px; font-size:12px; color:#aaa; text-align: right;">Updated: $(date)</div>
              </div>
          </body>
          </html>
          EOF

      # 4. Save and commit changes directly to New. This action triggers your outbound form webhook!
      - name: Push Page to New Repo (Triggers Outbound Webhook)
        run: |
          cd news_repo_folder
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff-index --quiet HEAD || git commit -m "Automated Chat Sync from Kenny Engine"
          git push origin HEAD
