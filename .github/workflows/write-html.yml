name: Webhook Form Writer

on:
  # This tells the 'New' repo to wake up when ANY activity hits its dispatch API URL
  repository_dispatch:
    types: [*]

jobs:
  write-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows GitHub to write code directly to this repository

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate the HTML file
        run: |
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html>
          <head>
              <title>New Repo Live Site</title>
          </head>
          <body>
              <h1>Successfully Written to New Repo!</h1>
              <p>This file was created automatically by a form webhook event triggered from the kenny repo.</p>
              <p>Last Processed: $(date)</p>
          </body>
          </html>
          EOF

      - name: Save and Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff-index --quiet HEAD || git commit -m "HTML written via kenny repo webhook"
          git push
