name: Kenny Multi-Task Engine

on:
  repository_dispatch:
    types: [*] # Wakes up and hands the caught email payload to BOTH jobs below

jobs:
  # JOB 1: Handles forwarding the data string over to the News Repo
  forward-to-news:
    runs-on: ubuntu-latest
    steps:
      - name: Forward Payload to News Repo Webhook
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/kenny0537YAhoo/New/dispatches \
            -d '{"event_type": "webhook_redirect", "client_payload": '"$(echo '${{ toJSON(
